name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Candidate checks validate the complete PR range, never a shallow
          # HEAD^ fallback that can omit earlier feature commits.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check types, complete base diff, and clean status
        run: npm run check
        env:
          NEOCODE_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: npm run build
