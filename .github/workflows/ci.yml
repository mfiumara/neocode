name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch true PR base history
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --unshallow origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" ||
            git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git branch -f main "origin/$BASE_BRANCH"
      - name: Record exact candidate Git evidence
        if: github.event_name == 'pull_request'
        env:
          NEOCODE_CANDIDATE_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: npm run candidate:evidence
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check types, complete base diff, and clean status
        run: npm run check
        env:
          NEOCODE_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: npm run build
