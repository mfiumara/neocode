<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b10" />
    <title>Neocode · Paseo map</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark">N</span>
        <div><strong id="repo">Neocode</strong><small>Paseo map</small></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions">
        <label class="search"
          ><span>/</span
          ><input
            id="search"
            type="search"
            placeholder="Find an agent or worktree"
            autocomplete="off"
        /></label>
        <button id="worktrees" class="active" type="button" disabled>
          paseo live
        </button>
        <button id="refresh" type="button" aria-label="Refresh">
          <span class="refresh-icon">↻</span>
        </button>
      </div>
    </header>
    <main>
      <nav id="projects" aria-label="Projects">
        <div class="project-list"></div>
      </nav>
      <section
        id="viewport"
        aria-label="Paseo projects, workspaces, and agents"
      >
        <svg id="graph" role="tree"></svg>
      </section>
      <aside id="details" aria-live="polite"></aside>
    </main>
    <footer>
      <span><kbd>h</kbd><kbd>j</kbd><kbd>k</kbd><kbd>l</kbd> navigate</span
      ><span><kbd>enter</kbd> agent</span><span><kbd>/</kbd> find</span
      ><span><kbd>r</kbd> refresh</span><span><kbd>?</kbd> help</span>
    </footer>
    <dialog id="help">
      <button class="close" aria-label="Close">×</button>
      <h2>Move like Neovim</h2>
      <div class="help-grid">
        <kbd>h</kbd><span>parent</span><kbd>j / k</kbd
        ><span>next / previous</span><kbd>l</kbd><span>first child</span
        ><kbd>gg / G</kbd><span>root / last</span><kbd>/ / n</kbd
        ><span>find / next result</span><kbd>enter</kbd
        ><span>open worktree agent</span><kbd>q / esc</kbd
        ><span>leave agent view</span><kbd>r</kbd
        ><span>refresh Git + Paseo</span>
      </div>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
